name: Pruebas de robustecimiento

on:
  push:
    branches:
      - 'avance8/robustecimiento'
      - 'avance8/apoyo-seguridad'
  pull_request:
    branches:
      - 'dev'
      - 'avance8/robustecimiento'

permissions:
  contents: read

jobs:
  robustecimiento:
    name: Pruebas de gestion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar version de Node.js
        run: node --version

      - name: Ejecutar pruebas
        run: npm test
